<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Prompt Bar Customizer</title>
    <style>
        :root {
            --bg: #0e1014;
            --panel: #17191d;
            --text: #e6e8ec;
            --text-muted: #9299a5;
            --accent: #58f01b;
            --border: #ffffff22;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #fff;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        button.secondary {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .status {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .status.error {
            background: #ff5f5622;
            border: 1px solid #ff5f56;
            color: #ff5f56;
            display: block;
        }
        .status.success {
            background: #58f01b22;
            border: 1px solid var(--accent);
            color: var(--accent);
            display: block;
        }
        .code-block {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #a9b7c6;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analytics Dashboard</h1>
        <div class="subtitle">Fetch and parse raw .xml logs from the analytics directory</div>

        <div class="status" id="statusBox"></div>

        <div class="controls">
            <input type="text" id="xmlName" placeholder="Enter log name (e.g., extension, direct_visit)" value="extension">
            <button onclick="fetchAndParseXML()">Fetch XML</button>
            <button class="secondary" onclick="fetchRawHTMLLog()">View Raw HTML Log</button>
        </div>

        <div class="card">
            <h2>Parsed XML Data</h2>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Referrer (Source)</th>
                        <th>User Agent</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">No data loaded. Click "Fetch XML" above.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Raw HTML Log (index.html)</h2>
            <div class="code-block" id="htmlLogViewer">No raw HTML log loaded.</div>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const tableBody = document.getElementById('tableBody');
        const htmlLogViewer = document.getElementById('htmlLogViewer');

        function showStatus(msg, isError = false) {
            statusBox.textContent = msg;
            statusBox.className = 'status ' + (isError ? 'error' : 'success');
            setTimeout(() => { statusBox.className = 'status'; }, 4000);
        }

        // Fetch and Parse the specific XML file
        async function fetchAndParseXML() {
            const nameInput = document.getElementById('xmlName').value.trim();
            const safeName = nameInput.replace(/[^a-zA-Z0-9_-]/g, '');
            if (!safeName) return showStatus('Please enter a valid name.', true);

            showStatus(`Fetching /analytics/${safeName}.xml...`);
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Loading...</td></tr>`;

            try {
                const response = await fetch(`/analytics/${safeName}.xml`);
                
                // If the server returns a 404 (which GitHub Pages will for POST requests)
                if (!response.ok) throw new Error(`HTTP ${response.status}: File not found or server doesn't support POST.`);
                
                const xmlText = await response.text();
                
                // Parse the XML
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                // Check for parsing errors
                const parseError = xmlDoc.querySelector("parsererror");
                if (parseError) throw new Error("Failed to parse XML structure.");

                const visits = xmlDoc.getElementsByTagName("visit");
                
                if (visits.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">XML file is empty.</td></tr>`;
                    return showStatus('Fetched XML, but it contained no <visit> nodes.');
                }

                // Build Table Rows
                let html = '';
                for (let i = 0; i < visits.length; i++) {
                    const timestamp = visits[i].getElementsByTagName("timestamp")[0]?.textContent || 'N/A';
                    const referrer = visits[i].getElementsByTagName("referrer")[0]?.textContent || 'N/A';
                    const ua = visits[i].getElementsByTagName("userAgent")[0]?.textContent || 'N/A';
                    
                    html += `
                        <tr>
                            <td>${new Date(timestamp).toLocaleString() || timestamp}</td>
                            <td><code>${referrer}</code></td>
                            <td title="${ua}">${ua.substring(0, 50)}${ua.length > 50 ? '...' : ''}</td>
                        </tr>
                    `;
                }
                
                tableBody.innerHTML = html;
                showStatus(`Successfully loaded ${visits.length} entries from ${safeName}.xml`);

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ff5f56;">Failed to load data.</td></tr>`;
                showStatus(error.message, true);
            }
        }

        // Fetch the raw index.html log file to view any HTML appended to it
        async function fetchRawHTMLLog() {
            htmlLogViewer.style.display = 'block';
            htmlLogViewer.textContent = "Fetching /analytics/index.html...";

            try {
                const response = await fetch('/analytics/index.html');
                if (!response.ok) throw new Error(`HTTP ${response.status}: Not found.`);
                
                const text = await response.text();
                
                // If the response is the raw text appended by the POST request, show it.
                // Otherwise, it'll just show the actual HTML source of this file.
                htmlLogViewer.textContent = text;
                showStatus('Loaded raw HTML log.');
            } catch (error) {
                htmlLogViewer.textContent = `Error loading raw HTML log: ${error.message}`;
                showStatus('Failed to load HTML log', true);
            }
        }
    </script>
</body>
</html>
